; Limity pre správu webu (PHP-FPM / CGI na Forpsi Linux; na Windows môže byť ignorovaný – správa sa prispôsobí)
upload_max_filesize = 32M
post_max_size = 34M
max_file_uploads = 12
memory_limit = 256M
max_execution_time = 120
display_errors = 0
log_errors = 1
expose_php = 0
session.use_strict_mode = 1
