<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka sa nenašla | HEAD SPA 30 Nitra</title>
<meta name="robots" content="noindex, follow">

<!-- Cesty sú od koreňa /head-spa-30/, lebo GitHub Pages ukáže túto stránku na akejkoľvek zlej adrese -->
<link rel="icon" type="image/svg+xml" href="/head-spa-30/assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/head-spa-30/assets/apple-touch-icon.png">
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:300 700;font-display:swap;src:url(/head-spa-30/assets/fonts/Lora-display.woff2) format('woff2')}
@font-face{font-family:'Lora';font-style:italic;font-weight:300 700;font-display:swap;src:url(/head-spa-30/assets/fonts/Lora-italic.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(/head-spa-30/assets/fonts/Manrope-400.woff2) format('woff2')}
/* tóny orecha so zlatou ako na hlavnej stránke */
:root{--canvas:#0c0906;--text:#f2ede2;--muted:#b9b3a6;--accent:#d9b56a;--accent-hover:#ecd08f;--line:rgba(242,237,226,.22)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:48px 16px;
  background:var(--canvas);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:560px;text-align:center}
.mark{display:block;width:56px;height:56px;margin:0 auto 28px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:Lora,Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,56px);line-height:1.1;margin:16px 0 0}
h1 em{font-style:italic;color:var(--accent)}
p{color:var(--muted);margin:18px auto 0;max-width:40ch}
/* vlasová linka namiesto ozdôb */
.rule{width:48px;height:1px;background:var(--accent);margin:32px auto 0;border:0}
.cta{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* ploché hranaté tlačidlá, normálne písmo */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:2px;
  font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--text);background:transparent;transition:border-color .2s,background-color .2s,color .2s}
.btn:hover{border-color:var(--accent);color:var(--accent-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#17120a}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#17120a}
.fine{margin-top:32px;font-size:14px;color:var(--muted)}
.fine a{color:var(--text);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:380px){.btn{width:100%}}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="#d9b56a" stroke-width="1.5"/><path d="M32 19c3.6 4.6 4.6 10.6 0 18.5c-4.6-7.9-3.6-13.9 0-18.5zM32 37.5c-5.2-1-9.6-5.2-10.8-11.4c5.3 1.1 8.9 5 10.8 11.4zM32 37.5c5.2-1 9.6-5.2 10.8-11.4c-5.3 1.1-8.9 5-10.8 11.4zM32 38.6c-7.2 0-12.6-2.9-15.6-7c6.2-.6 11.6 2 15.6 7zM32 38.6c7.2 0 12.6-2.9 15.6-7c-6.2-.6-11.6 2-15.6 7z" fill="none" stroke="#f3c98a" stroke-width="1.3" stroke-linejoin="round"/><path d="M21 45.5h22" stroke="#d9b56a" stroke-width="1.2" stroke-linecap="round"/></svg>
  <div class="kicker">Chyba 404</div>
  <h1>Táto stránka <em>neexistuje.</em></h1>
  <p>Odkaz je asi starý alebo má preklep. Rituály aj rezerváciu nájdeš na úvode.</p>
  <hr class="rule">
  <div class="cta">
    <a class="btn primary" href="/head-spa-30/">Späť na úvod</a>
    <a class="btn" href="https://booqme.app/sk/rezervacia/barbershop-30" rel="noopener">Rezervovať termín</a>
  </div>
  <p class="fine">Mostná 30, Nitra · <a href="tel:+421911153136">0911 153 136</a></p>
</main>
</body>
</html>
