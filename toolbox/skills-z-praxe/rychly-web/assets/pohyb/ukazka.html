<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohyb bez knižnice – ukážka</title>
<link rel="stylesheet" href="pohyb.css">
<style>
  :root { --tlo: #15110d; --text: #efe6d8; --zlata: #c48c4a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--tlo); color: var(--text); font: 17px/1.6 system-ui, sans-serif; }
  header { min-height: 92vh; display: grid; place-content: center; padding: 24px; text-align: center; }
  h1 { font-size: clamp(2rem, 7vw, 4.5rem); line-height: 1.05; margin: 0 0 12px; }
  .zlata { color: var(--zlata); }
  section { padding: 72px 24px; max-width: 760px; margin: 0 auto; }
  ul { list-style: none; padding: 0; display: grid; gap: 12px; }
  li { border-top: 1px solid rgb(239 230 216 / 0.18); padding: 14px 0; }
  .vyska { height: 60vh; }
</style>
<script src="pohyb.js" defer></script>
</head>
<body>
<header class="svetlo" data-svetlo id="uvod">
  <h1>Strih, ktorý <span class="zlata">sedí</span></h1>
  <p>Prvá obrazovka nemá data-pohyb: nečaká na skript.</p>
</header>
<section id="sluzby">
  <h2 data-pohyb>Služby</h2>
  <ul>
    <li data-pohyb="vysun">Strih</li>
    <li data-pohyb="vysun">Brada</li>
    <li data-pohyb="vysun">Strih a brada</li>
    <li data-pohyb="vysun">Detský strih</li>
  </ul>
</section>
<div class="vyska"></div>
<section id="kontakt">
  <h2 data-pohyb>Kontakt</h2>
  <p data-pohyb>Rezervácia online.</p>
</section>
<div class="vyska"></div>
</body>
</html>
