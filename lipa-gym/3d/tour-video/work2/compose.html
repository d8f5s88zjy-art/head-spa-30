<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>GYM KLUB video</title>
<style>
@font-face{font-family:"Archivo";src:url(../../assets/fonts/Archivo-latin.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:"Archivo";src:url(../../assets/fonts/Archivo-latin-ext.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F}
@font-face{font-family:"Plex Mono";src:url(../../assets/fonts/PlexMono-latin.woff2) format("woff2");font-weight:500;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Mono";src:url(../../assets/fonts/PlexMono-latin-ext.woff2) format("woff2");font-weight:500;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#060707}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;background:#060707;color:#f1efe9;font-family:Archivo,sans-serif}
.L{position:absolute;inset:0;overflow:hidden}
.L img{position:absolute;left:50%;top:50%;will-change:transform}
.cover{width:1080px;height:1920px;object-fit:cover}
.bgblur{width:1080px;height:1920px;object-fit:cover;filter:blur(46px) brightness(.38) saturate(1.1)}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 16%,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.86) 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 110% 80% at 50% 45%,rgba(0,0,0,0) 62%,rgba(0,0,0,.35))}
.mono{font-family:"Plex Mono",monospace;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
/* orientácia: 8 úsekov hore */
#bar{position:absolute;left:72px;right:72px;top:96px;display:flex;gap:8px}
#bar i{flex:1;height:4px;background:rgba(255,255,255,.28);overflow:hidden}
#bar i b{display:block;height:100%;background:#fff;transform-origin:0 0;transform:scaleX(0)}
#brand{position:absolute;left:72px;top:124px;font-size:24px;color:rgba(255,255,255,.9)}
/* popis priestoru */
#cap{position:absolute;left:72px;right:72px;bottom:380px}
#cap .n{font-size:28px;color:#fff;display:flex;align-items:center;gap:16px}
#cap .n::before{content:"";width:34px;height:4px;background:#ff3a24}
#cap .h{margin-top:22px;font-weight:880;font-stretch:72%;font-size:118px;line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
#cap .s{margin-top:24px;font-size:40px;line-height:1.3;color:#f1efe9;font-weight:500}
#cap>*{text-shadow:0 3px 24px rgba(0,0,0,.55)}
/* úvod */
#open{position:absolute;left:72px;right:72px;bottom:430px}
#open .k{font-size:28px}
#open .t{margin-top:26px;font-weight:900;font-stretch:66%;font-size:250px;line-height:.8;text-transform:uppercase;letter-spacing:-.01em}
#open .t span{display:block;overflow:hidden}
#open .t span i{display:block;font-style:normal}
/* záver */
#end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 72px 420px}
#end .k{font-size:28px;color:#e9e7e1}
#end .t{margin-top:26px;font-weight:900;font-stretch:66%;font-size:230px;line-height:.8;text-transform:uppercase}
#end .p{margin-top:34px;font-size:46px;line-height:1.3;font-weight:560}
#end .line{margin-top:44px;height:2px;background:rgba(255,255,255,.3)}
#end .c{margin-top:36px;display:flex;align-items:center;justify-content:space-between;font-size:30px}
#end .btn{display:inline-flex;align-items:center;gap:22px;padding:24px 26px 24px 40px;border-radius:999px;background:#f1efe9;color:#060707;font-weight:720;font-size:36px}
#end .btn b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#060707;color:#f1efe9;font-size:32px}
</style>
</head>
<body>
<div id="v">
  <div class="L" id="L0"></div>
  <div class="scrim"></div><div class="vig"></div>
  <div id="bar"></div>
  <p id="brand" class="mono">GYM KLUB · Nitra</p>
  <div id="cap"><p class="n mono"></p><p class="h"></p><p class="s"></p></div>
  <div id="open"><p class="k mono">Výstavná 6 · Lipa Centrum · Nitra</p><p class="t"><span><i>GYM</i></span><span><i>KLUB</i></span></p></div>
  <div id="end"><p class="k mono">Fitko a bojové športy</p><p class="t">GYM KLUB</p><p class="p">Výstavná 6, Lipa Centrum, Nitra.<br>Na samostatný tréning sa netreba objednávať.</p><div class="line"></div><div class="c"><span class="btn">Celá prehliadka na webe <b>→</b></span><span class="mono">Odkaz v popise</span></div></div>
</div>
<script>
const S = window.STORY;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const L0 = $('#L0');
const imgs = {};
const need = [...new Set(S.shots.filter(s => s.img).map(s => s.img))];
window.ready = Promise.all(need.map(n => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = '../../media/' + n; imgs[n] = i; }))).then(() => document.fonts.ready);
const bar = $('#bar'); for (let i = 0; i < 8; i++) { const e = document.createElement('i'); e.append(document.createElement('b')); bar.append(e); }
let curKey = '';
function layer(sh) {
  const key = sh.t0 + sh.kind;
  if (key === curKey) return; curKey = key;
  L0.innerHTML = '';
  const add = (cls, src) => { const i = document.createElement('img'); i.className = cls; i.src = '../../media/' + src; L0.append(i); return i; };
  if (sh.kind === 'end') { const i = add('cover', 'g-funkcna-zona-7-1600.avif'); i.style.filter = 'blur(6px) brightness(.34) saturate(.9)'; return; }
  if (sh.wide) { add('bgblur', sh.img); const f = add('', sh.img); f.style.width = '1080px'; f.style.height = '720px'; f.dataset.fg = 1; return; }
  if (sh.kind === 'pano') { const f = add('', sh.img); f.style.height = '1920px'; f.style.width = 'auto'; f.dataset.pano = 1; return; }
  add('cover', sh.img);
}
window.render = t => {
  const sh = S.shots.find(s => t >= s.t0 && t < s.t0 + s.dur) || S.shots[S.shots.length - 1];
  const p = (t - sh.t0) / sh.dur;
  layer(sh);
  const im = L0.querySelector('img:last-child');
  // pohyb kamery: pomalý nájazd s dobehom, strany sa striedajú
  if (sh.kind === 'open') im.style.transform = `translate(-50%,-50%) scale(${1.14 - .08 * eo(p)})`;
  else if (sh.kind === 'end') im.style.transform = `translate(-50%,-50%) scale(1.1)`;
  else if (sh.kind === 'pano') {
    const w = im.naturalWidth * 1920 / im.naturalHeight, span = Math.max(0, w - 1080);
    im.style.transform = `translate(calc(-50% + ${(span / 2 - span * eio(p)).toFixed(1)}px),-50%)`;
  } else if (im.dataset.fg) im.style.transform = `translate(-50%,-58%) scale(${1 + .05 * eo(p)})`;
  else im.style.transform = `translate(calc(-50% + ${(sh.dir * (18 - 36 * eo(p))).toFixed(1)}px),-50%) scale(${1.1 - .05 * eo(p)})`;
  // prelínanie z čiernej na začiatku a pri záverečnej karte
  const fade = sh.kind === 'open' ? clamp(t / .45) : sh.kind === 'end' ? clamp((t - sh.t0) / .35) : 1;
  L0.style.opacity = fade;
  // úvodný titulok
  const o = $('#open'), ot = t - S.shots[0].t0;
  o.style.display = sh.kind === 'open' ? 'block' : 'none';
  if (sh.kind === 'open') {
    o.querySelector('.k').style.opacity = clamp((ot - .35) / .4);
    o.querySelectorAll('.t i').forEach((e, k) => { const q = eo((ot - .5 - k * .1) / .7); e.style.transform = `translateY(${(1 - q) * 105}%)`; });
    o.style.opacity = 1 - clamp((ot - 2.15) / .25);
  }
  // popis priestoru
  const cap = $('#cap');
  const show = sh.name && sh.kind !== 'open';
  cap.style.display = show ? 'block' : 'none';
  if (show) {
    cap.querySelector('.n').textContent = `${sh.n} / 08`;
    cap.querySelector('.h').textContent = sh.name;
    cap.querySelector('.s').textContent = sh.sub;
    const zt = t - sh.z0;
    [...cap.children].forEach((e, k) => { const q = eo((zt - k * .07) / .45); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * 26}px)`; });
  }
  // pás priestorov a značka
  const zi = sh.n ? +sh.n : 0;
  bar.style.opacity = $('#brand').style.opacity = sh.kind === 'open' || sh.kind === 'end' ? 0 : 1;
  [...bar.children].forEach((e, k) => {
    let f = k + 1 < zi ? 1 : 0;
    if (k + 1 === zi) { const zs = S.shots.filter(s => s.n === sh.n), a = zs[0].t0, b = zs[zs.length - 1].t0 + zs[zs.length - 1].dur; f = clamp((t - a) / (b - a)); }
    e.firstChild.style.transform = `scaleX(${f})`;
  });
  // záverečná karta
  const en = $('#end'), et = t - sh.t0;
  en.style.display = sh.kind === 'end' ? 'flex' : 'none';
  if (sh.kind === 'end') [...en.children].forEach((e, k) => { const q = eo((et - .25 - k * .09) / .6); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * 30}px)`; });
};
</script>
</body>
</html>
