name: Web na GitHub Pages

# GitHub Pages nasadzuje len z hlavnej vetvy, preto tu žiadna iná vetva nie je.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pripraviť súbory webu
        run: mkdir -p _site && cp -r index.html 404.html pravne.html robots.txt sitemap.xml assets admin _site/
      - name: Balík na FTP na stiahnutie (headspa30-ftp.zip)
        run: sh tools/ftp-balik.sh headspa30.sk "$PWD/_site/headspa30-ftp.zip"
      - name: Ten istý web v menších ZIPoch (do 19 MB)
        run: python3 tools/ftp-rozdel.py _site 18
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
