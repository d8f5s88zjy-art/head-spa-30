name: Web na FTP (vlastný hosting)

# Po každej zmene v main (aj po uložení v admine) nahrá web na FTP hosting.
# Beží, len keď sú v GitHube nastavené tajomstvá (Settings → Secrets and variables → Actions):
#   FTP_SERVER  napr. ftpx.forpsi.com
#   FTP_USER    FTP login
#   FTP_PASSWORD FTP heslo
#   FTP_DIR     priečinok webu na serveri, napr. /www/ (ak chýba, použije sa /www/)
#   FTP_DOMENA  doména webu, napr. headspa30.sk (ak chýba, použije sa headspa30.sk)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: FTP nie je nastavené
        if: env.FTP_SERVER == ''
        run: echo "Tajomstvo FTP_SERVER chýba, na FTP sa nič nenahráva."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - name: Pripraviť web pre vlastnú doménu
        if: env.FTP_SERVER != ''
        run: sh tools/ftp-balik.sh "${{ secrets.FTP_DOMENA || 'headspa30.sk' }}"
      - name: Vernostná kartička – konfigurácia z tajomstiev (heslá admina len ako odtlačky)
        if: env.FTP_SERVER != ''
        env:
          HESLO_B: ${{ secrets.VERNOST_HESLO_BARBERSHOP }}
          HESLO_H: ${{ secrets.VERNOST_HESLO_HEADSPA }}
          EMAIL_OD: ${{ secrets.VERNOST_EMAIL_OD }}
          DOMENA: ${{ secrets.FTP_DOMENA || 'headspa30.sk' }}
        run: php tools/vernost-config.php > _ftp/vernost/config.php
      - name: Vernostná kartička – zapnúť prihlášku na webe HEAD SPA 30, ak má prevádzka heslo do adminu
        if: env.FTP_SERVER != ''
        env:
          HESLO_H: ${{ secrets.VERNOST_HESLO_HEADSPA }}
        run: |
          if [ ${#HESLO_H} -ge 10 ]; then sed -i 's#data-prevadzka="headspa"#data-prevadzka="headspa" data-zapnute#' _ftp/index.html; echo "prihláška zapnutá"; else echo "prihláška vypnutá (chýba VERNOST_HESLO_HEADSPA)"; fi
      - name: Asistent na otázky – knižnica a konfigurácia z tajomstva (kľúč API len na serveri)
        if: env.FTP_SERVER != ''
        env:
          KLUC: ${{ secrets.ANTHROPIC_API_KEY }}
          KALENDAR_URL: ${{ vars.ASISTENT_KALENDAR_URL }}
        run: |
          composer install -d _ftp/asistent --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          # na hosting len kód knižnice (bez testov, príkladov a histórie gitu)
          rm -rf _ftp/asistent/vendor/*/*/.git _ftp/asistent/vendor/anthropic-ai/sdk/tests _ftp/asistent/vendor/anthropic-ai/sdk/fixtures _ftp/asistent/vendor/anthropic-ai/sdk/examples _ftp/asistent/vendor/anthropic-ai/sdk/scripts
          php tools/asistent-config.php > _ftp/asistent/config.php
      # Najprv šifrovane (FTPS), aby heslo, konfigurácia vernostnej kartičky a súbory nešli sieťou čitateľne.
      # Ak hosting FTPS nepodporuje, nahrá sa po starom cez FTP (stav synchronizácie je spoločný).
      - name: Nahrať na FTP šifrovane (len zmenené súbory)
        id: ftps
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_ftp/
          server-dir: ${{ secrets.FTP_DIR || '/www/' }}
      - name: Nahrať na FTP (záloha, ak FTPS nejde)
        if: env.FTP_SERVER != '' && steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_ftp/
          server-dir: ${{ secrets.FTP_DIR || '/www/' }}
