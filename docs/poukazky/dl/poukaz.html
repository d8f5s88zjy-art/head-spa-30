<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Darčekové poukážky HEAD SPA 30, formát DL</title>
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:300 700;src:url(../../../assets/fonts/Lora-display.woff2) format('woff2')}
@font-face{font-family:'Lora';font-style:italic;font-weight:300 700;src:url(../../../assets/fonts/Lora-italic.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:400;src:url(../../../assets/fonts/Manrope-400.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:700;src:url(../../../assets/fonts/Manrope-700.woff2) format('woff2')}
/* písané „poukážka“ podľa vzoru salónu, len na poukážkach, nie na webe (Pinyon Script, licencia OFL) */
@font-face{font-family:'Pinyon';font-weight:400;src:url(pismo/PinyonScript.woff2) format('woff2')}
:root{--gold:#d9b56a;--gold-hi:#f0d28a;--gold-dk:#9c7a3a;--ink:#f2ede2;--bg:#0b100d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222}
body{font-family:'Manrope',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
/* Karta DL na šírku so spadávkou 3 mm: 216 × 105 mm, 1 mm = 5 px */
.card{position:relative;width:1080px;height:525px;overflow:hidden;background:var(--bg);margin:0 auto}
.bg{position:absolute;inset:0;background:
  radial-gradient(55% 75% at 22% 30%,rgba(217,181,106,.14),transparent 62%),
  radial-gradient(45% 70% at 80% 55%,rgba(217,181,106,.10),transparent 65%),
  linear-gradient(120deg,#12160f 0%,#0a0e0b 55%,#0d100c 100%)}
/* jemné zlaté žilky ako na vzore */
.veins{position:absolute;inset:0;opacity:.35;background:
  radial-gradient(120% 40% at 10% 90%,rgba(217,181,106,.10),transparent 60%),
  radial-gradient(60% 30% at 70% 10%,rgba(217,181,106,.08),transparent 60%)}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>")}
/* zlatý rám vo vnútri spadávky */
.frame{position:absolute;inset:28px;border:1.5px solid rgba(217,181,106,.8)}
.frame2{position:absolute;inset:35px;border:.75px solid rgba(217,181,106,.3)}
/* fotografia vpravo v oblúkovom ráme, teplé zlaté ladenie */
.photo{position:absolute;right:66px;top:50px;width:400px;height:352px;border-radius:200px 200px 18px 18px;overflow:hidden;box-shadow:0 0 0 2px rgba(240,210,138,.9),0 0 0 9px var(--bg),0 0 0 10px rgba(217,181,106,.3),0 30px 60px rgba(0,0,0,.6)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 40%);filter:sepia(.32) saturate(.95) brightness(.88) contrast(1.08)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,13,0) 50%,rgba(11,16,13,.6) 100%),linear-gradient(90deg,rgba(11,16,13,.35),transparent 30%),radial-gradient(60% 60% at 70% 30%,rgba(240,210,138,.12),transparent 70%)}
/* zlatá vetvička medzi textom a fotkou */
.branch{position:absolute;left:566px;top:246px;width:100px;height:156px;opacity:.9}
/* pečať */
.seal{position:absolute;right:52px;bottom:120px;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5dc9b,#d9b56a 55%,#9c7a3a 100%);box-shadow:0 0 0 4px var(--bg),0 0 0 5px rgba(217,181,106,.6),0 14px 30px rgba(0,0,0,.55);display:grid;place-items:center;color:#2a2110}
.seal svg{width:118px;height:118px;position:absolute;inset:0}
.seal .num{font-family:'Lora',serif;font-size:38px;line-height:1;position:relative;top:2px}
.seal .num small{display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:8px;letter-spacing:.28em;text-transform:uppercase;text-align:center;margin-top:4px}
/* text vľavo, zarovnaný na stred stĺpca */
.txt{position:absolute;left:96px;top:52px;width:460px;text-align:center}
.brand .mark{width:44px;height:44px;margin:0 auto}
.brand b{display:block;font-family:'Lora',serif;font-weight:500;font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:6px}
.brand small{display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.kind{margin-top:16px;line-height:.9}
.kind .a{display:block;font-family:'Lora',serif;font-weight:500;font-size:34px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.kind .b{display:block;font-family:'Pinyon',cursive;font-weight:400;font-size:74px;line-height:.9;letter-spacing:.01em;color:var(--gold-hi);margin-top:2px;text-shadow:0 2px 18px rgba(240,210,138,.28)}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;font-family:'Lora',serif;font-weight:500;font-size:19px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.rule::before,.rule::after{content:"";height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
.cat{margin-top:8px;font-family:'Manrope',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.36em;text-transform:uppercase;color:rgba(242,237,226,.78)}
.lede{margin:14px auto 0;font-size:11.5px;line-height:1.55;color:rgba(242,237,226,.78);max-width:330px}
/* polia na vyplnenie a spodný riadok */
.fields{position:absolute;left:120px;right:78px;bottom:70px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1.1fr .9fr;gap:14px}
.f{display:flex;align-items:center;gap:8px;font-family:'Manrope',sans-serif;font-weight:700;font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.f span{display:block;flex:1;height:20px;border-radius:3px;background:linear-gradient(180deg,rgba(242,237,226,.94),rgba(226,218,200,.94));box-shadow:inset 0 0 0 1px rgba(217,181,106,.6)}
.foot{position:absolute;left:78px;right:78px;bottom:44px;display:flex;align-items:center;justify-content:center;gap:16px;font-family:'Manrope',sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(217,181,106,.9)}
.foot::before,.foot::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(217,181,106,.5))}
.foot::after{background:linear-gradient(90deg,rgba(217,181,106,.5),transparent)}
/* stuha po ľavom okraji s mašľou hore */
.bow{position:absolute;left:0;top:0;width:200px;height:525px}
/* verzia pre Booqme a sociálne siete: 980 × 700 px, bez polí na vyplnenie */
.card.sq{width:980px;height:700px}
.card.sq .photo{right:auto;left:112px;top:314px;width:798px;height:316px;border-radius:26px 26px 22px 22px}
.card.sq .photo::after{background:linear-gradient(180deg,rgba(11,16,13,0) 60%,rgba(11,16,13,.5) 100%)}
.card.sq .seal{right:56px;bottom:auto;top:256px;width:124px;height:124px}
.card.sq .txt{left:0;right:0;width:auto;top:44px}
.card.sq .kind{margin-top:10px}
.card.sq .kind .a{font-size:30px}
.card.sq .kind .b{font-size:66px}
.card.sq .rule{margin-top:6px}
.card.sq .cat{margin-top:6px}
.card.sq .lede,.card.sq .fields,.card.sq .branch{display:none}
.card.sq .foot{left:70px;right:70px;bottom:36px}
.card.sq .bow{width:170px;height:700px}
/* rub */
.back .txt{width:560px;top:70px;text-align:left;left:78px}
.back .brand{display:flex;align-items:center;gap:14px;text-align:left}
.back .brand .mark{margin:0}
.back .brand b{font-size:26px;margin:0}
.back h2{font-family:'Lora',serif;font-weight:500;font-size:26px;letter-spacing:.02em;margin-top:26px}
.back ol{margin-top:14px;padding-left:18px;font-size:12px;line-height:1.7;color:rgba(242,237,226,.8)}
.back li+li{margin-top:4px}
.back .list{margin:20px 0 0;font-size:11px;line-height:1.6;color:rgba(242,237,226,.66);max-width:470px}
.back .qr{position:absolute;right:86px;top:96px;width:172px;height:172px;background:#fff;border-radius:12px;padding:10px;box-shadow:0 0 0 2px rgba(217,181,106,.7),0 0 0 8px var(--bg),0 0 0 9px rgba(217,181,106,.3)}
.back .qr img{width:100%;height:100%;display:block}
.back .qrl{position:absolute;right:66px;top:290px;width:212px;text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:7.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);line-height:1.9}
.back .qrl b{display:block;font-family:'Lora',serif;font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:none;color:var(--ink)}
.back .foot{justify-content:space-between}
.back .foot::before,.back .foot::after{display:none}
</style>
</head>
<body>
<!--CARDS-->
</body>
</html>
