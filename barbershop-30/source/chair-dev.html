<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kreslo – vývoj (BARBERSHOP 30)</title>
  <style>
    :root { --ink: #0e0d0c; }
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      /* rovnaký podklad ako .stage-bg: --ink → #1A1511 vľavo dole */
      background: radial-gradient(130% 95% at 0% 100%, #1a1511 0%, var(--ink) 72%), var(--ink);
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 12px; top: 10px; z-index: 2; font: 12px/1.4 system-ui, sans-serif; color: rgba(241,233,221,.7); pointer-events: none; white-space: pre; }
    #err { position: fixed; left: 12px; bottom: 12px; z-index: 3; color: #ff6b6b; font: 13px system-ui, sans-serif; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <div id="err"></div>
  <script type="module">
    import { createChairStage } from '../assets/chair.js';

    window.__renderDone = false;
    window.__renderError = null;
    window.__renderMs = null;

    const q = new URLSearchParams(location.search);
    const view = q.get('view');
    const VIEWS = { 'uvod-desktop': [1, 0, false], 'uvod-mobile': [1, 0, true], 'rezervacia-desktop': [7, 0, false], 'rezervacia-mobile': [7, 0, true] };
    let scene = Number(q.get('scene') || 1), t = Number(q.get('t') || 0), mobile = q.get('mobile') === '1';
    if (view && VIEWS[view]) { [scene, t, mobile] = VIEWS[view]; }
    const quality = q.get('quality') === 'low' ? 'low' : 'high';
    const model = q.get('glb') === '0' ? 'procedural' : 'auto';          // &glb=0 → vždy procedurálne kreslo
    const modelYaw = q.has('yaw') ? Number(q.get('yaw')) * Math.PI / 180 : undefined; // &yaw=deg → otočenie GLB (bez parametra: auto = zrušiť yaw koreňového uzla)
    const hud = document.getElementById('hud');
    const t0 = performance.now();

    try {
      const stage = await createChairStage(document.getElementById('stage'), {
        dpr: Number(q.get('dpr')) || undefined,
        mobile,
        quality,
        model,
        modelYaw,
        onFirstFrame() { window.__renderMs = Math.round(performance.now() - t0); },
      });
      window.__stage = stage;
      window.__model = stage.modelKind();
      hud.textContent = `scene=${scene} t=${t} mobile=${mobile ? 1 : 0} quality=${quality} model=${window.__model} first frame ${window.__renderMs} ms`;
      stage.setProgress({ scene, t });
      // __renderDone až keď je vykreslený snímok so zadanou scénou/t (setProgress renderuje v ďalšom rAF)
      requestAnimationFrame(() => requestAnimationFrame(() => { window.__renderDone = true; }));
      if (q.get('sweep') === '1') stage.playIntroSweep();
      if (!mobile) window.addEventListener('pointermove', (e) => stage.setPointer(e.clientX / innerWidth, e.clientY / innerHeight));
      window.addEventListener('resize', () => stage.resize());
      // klávesy: šípky = t, 1/2/7 = scéna, s = prejazd svetla
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') t = Math.min(1, t + 0.05);
        else if (e.key === 'ArrowLeft') t = Math.max(0, t - 0.05);
        else if ('127'.includes(e.key) && e.key) scene = Number(e.key);
        else if (e.key === 's') { stage.playIntroSweep(); return; }
        else return;
        stage.setProgress({ scene, t });
        hud.textContent = `scene=${scene} t=${t.toFixed(2)} mobile=${mobile ? 1 : 0}`;
      });
    } catch (e) {
      window.__renderError = String(e && e.stack || e);
      window.__renderDone = true;
      document.getElementById('err').textContent = window.__renderError;
    }
  </script>
</body>
</html>
