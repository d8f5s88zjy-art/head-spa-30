<!doctype html><html lang="sk"><head><meta charset="utf-8"><title>GLB náhľad</title>
<style>html,body{margin:0;height:100%;background:linear-gradient(135deg,#0e0d0c 0%,#1a1511 100%)}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../assets/vendor/three.module.min.js';
import { RoomEnvironment } from '../assets/vendor/RoomEnvironment.js';
import { GLTFLoader } from './tools/GLTFLoader.js';
import { MeshoptDecoder } from '../assets/vendor/meshopt_decoder.module.js';
window.__renderDone=false;
const q=new URLSearchParams(location.search); const file=q.get('file')||'model/kreslo-tripo-1.glb'; const az=parseFloat(q.get('az')||'-40')*Math.PI/180; const el=parseFloat(q.get('el')||'18')*Math.PI/180; const dist=parseFloat(q.get('dist')||'3.4');
const canvas=document.getElementById('c'); const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); r.setPixelRatio(1); r.setSize(innerWidth,innerHeight,false); r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); const pm=new THREE.PMREMGenerator(r); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,50);
const key=new THREE.SpotLight(0xffd8b4,40,20,0.6,0.5,1.4); key.position.set(-3,4,3); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const rim=new THREE.SpotLight(0xff9a58,25,20,0.7,0.6,1.5); rim.position.set(3,2.5,-3); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x2a2622,0x0e0d0c,1.2));
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.ShadowMaterial({opacity:.55})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder); loader.load(file,g=>{
  const o=g.scene; const box=new THREE.Box3().setFromObject(o); const size=box.getSize(new THREE.Vector3()); const s=1.6/size.y; o.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(o); const c=b2.getCenter(new THREE.Vector3()); o.position.set(-c.x,-b2.min.y,-c.z);
  o.traverse(m=>{ if(m.isMesh){ m.castShadow=true; m.receiveShadow=true; const mat=m.material; if(mat){ mat.envMapIntensity=0.55; } } });
  scene.add(o);
  const t=new THREE.Vector3(0,0.75,0); cam.position.set(Math.sin(az)*Math.cos(el)*dist, 0.75+Math.sin(el)*dist, Math.cos(az)*Math.cos(el)*dist); cam.lookAt(t);
  r.render(scene,cam); window.__renderDone=true; console.log('rendered',file,'tris', (()=>{let n=0;o.traverse(m=>{if(m.isMesh&&m.geometry.index)n+=m.geometry.index.count/3});return n})());
},undefined,e=>{console.error('GLB error',e); window.__renderDone=true;});
</script></body></html>
